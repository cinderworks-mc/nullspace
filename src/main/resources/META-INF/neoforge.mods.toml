versionRange="[0,)"
ordering="NONE"
side="BOTH"
# Optional Carry On: the guard is compiled against its event class and data API and loaded only when it is present. Observed on every 1.21.1 release
# (2.2.2.11, 2.2.4.4, 2.2.5.8, 2.2.6.13). The range is open on purpose: a closed range makes FML refuse to start with a version outside it; a real API
# mismatch is caught at startup and at event time and switches the guard off with a logged error instead of failing the launch.
[[dependencies.nullspace]]
modId="carryon"
type="optional"
versionRange="[0,)"
ordering="NONE"
side="BOTH"
